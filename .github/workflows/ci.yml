name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned to macOS 26 (ships Xcode 26.x only; see actions/runner-images).
# The newest Xcode on the image is selected so builds use the iOS 26 SDK or newer.

jobs:
  engine-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: TennisCore tests
        run: swift test --package-path Packages/TennisCore
      - name: Info.plist strings gate
        run: scripts/gates/check-infoplist-strings.sh
      - name: Project format gate (Xcode 26 must open the project)
        run: scripts/gates/check-project-format.sh

  app-builds:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: TennisBeat
            destination: generic/platform=iOS Simulator
          - scheme: TennisBeat Watch App
            destination: generic/platform=watchOS Simulator
    name: build (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  # Watch unit and UI tests (spec 002, research R12). Not a required check; Denys decides.
  watch-tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Pick the 40 mm watchOS simulator
        id: sim
        run: |
          set -euo pipefail
          # The 40 mm watch is the layout target (spec 002, Q9). Fall back to the first
          # available watchOS simulator only if the image has no 40 mm model.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          watches = [d for runtime, ds in sorted(devices.items()) if "watchOS" in runtime for d in ds]
          pinned = [d for d in watches if "(40mm)" in d["name"]]
          chosen = pinned[-1:] or watches[:1]  # newest runtime first, else the first watch
          print(chosen[0]["udid"] if chosen else "")
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [ -z "$udid" ]; then echo "::warning::No watchOS simulator on this image; running build-for-testing only (R12 fallback)."; fi
          xcrun simctl list devices available | grep -F "$udid" || true
      - name: Boot the simulator
        if: steps.sim.outputs.udid != ''
        run: |
          # UI tests tap only after the device has finished booting (#18 R1-1).
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Watch tests
        if: steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          xcodebuild test \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for testing (no watchOS simulator)
        if: steps.sim.outputs.udid == ''
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
