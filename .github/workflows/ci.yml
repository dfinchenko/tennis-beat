name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned to macOS 26 (ships Xcode 26.x only; see actions/runner-images).
# The newest Xcode on the image is selected so builds use the iOS 26 SDK or newer.

jobs:
  engine-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: TennisCore tests
        run: swift test --package-path Packages/TennisCore
      - name: Info.plist strings gate
        run: scripts/gates/check-infoplist-strings.sh
      - name: Project format gate (Xcode 26 must open the project)
        run: scripts/gates/check-project-format.sh

  app-builds:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: TennisBeat
            destination: generic/platform=iOS Simulator
          - scheme: TennisBeat Watch App
            destination: generic/platform=watchOS Simulator
    name: build (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  # Which layout matrix the watch UI tests run: "full" when the PR changes header or layout
  # files (scripts/layout-scope.sh), "worst" otherwise; pushes to main run "full".
  layout-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Layout scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            matrix="$(scripts/layout-scope.sh "$BASE" "$HEAD")"
          else
            matrix=full
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Layout matrix: $matrix"

  # Watch unit and UI tests in three shards (watch-tests.yml). Not a required check; Denys decides.
  watch-tests:
    needs: layout-scope
    uses: ./.github/workflows/watch-tests.yml
    with:
      layout_matrix: ${{ needs.layout-scope.outputs.matrix }}
