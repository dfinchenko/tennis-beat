name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned to macOS 26 (ships Xcode 26.x only; see actions/runner-images).
# The newest Xcode on the image is selected so builds use the iOS 26 SDK or newer.

jobs:
  engine-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: TennisCore tests
        run: swift test --package-path Packages/TennisCore

  app-builds:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: TennisBeat
            destination: generic/platform=iOS Simulator
          - scheme: TennisBeat Watch App
            destination: generic/platform=watchOS Simulator
    name: build (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
