name: Watch tests

# Watch unit and UI tests (spec 002, research R12), called by CI on every PR and by the nightly
# workflow. Three shards run in parallel to keep PR CI under about 20 minutes (CI budget, Denys:
# https://github.com/dfinchenko/tennis-beat/pull/31#issuecomment-6238799308 and
# https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6240987129). Every PR still runs
# every test; only the layout matrix of testUS6s2HeartRateFitsAndKeepsTheZones is cut to its
# worst case unless `layout_matrix` is "full". `rest` skips the classes the other shards name,
# so a new UI test class always runs.

on:
  workflow_call:
    inputs:
      layout_matrix:
        description: '"worst" (UK, XXXL, ♥ 205, all phases) or "full" (EN, PL, UK; ♥ 205 and "--")'
        type: string
        default: worst

permissions:
  contents: read

jobs:
  watch-tests:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced on #32's CI times (UI minutes, full / worst layout matrix):
          # audits 13.6, layout 13.8 / 6.7, rest 11.6; each job adds about 5 minutes of setup.
          - shard: audits
            selection: |
              -only-testing:TennisBeat Watch AppTests
              -only-testing:TennisBeat Watch AppUITests/AccessibilityAuditUITests
              -only-testing:TennisBeat Watch AppUITests/ControlsUITests
              -only-testing:TennisBeat Watch AppUITests/HealthOnboardingUITests
          - shard: layout
            selection: |
              -only-testing:TennisBeat Watch AppUITests/ScoreAccessibilityUITests
              -only-testing:TennisBeat Watch AppUITests/SummaryUITests
              -only-testing:TennisBeat Watch AppUITests/WorkoutUITests
          - shard: rest
            selection: |
              -skip-testing:TennisBeat Watch AppTests
              -skip-testing:TennisBeat Watch AppUITests/AccessibilityAuditUITests
              -skip-testing:TennisBeat Watch AppUITests/ControlsUITests
              -skip-testing:TennisBeat Watch AppUITests/HealthOnboardingUITests
              -skip-testing:TennisBeat Watch AppUITests/ScoreAccessibilityUITests
              -skip-testing:TennisBeat Watch AppUITests/SummaryUITests
              -skip-testing:TennisBeat Watch AppUITests/WorkoutUITests
    name: watch-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Pick the 40 mm watchOS simulator
        id: sim
        run: |
          set -euo pipefail
          # The 40 mm watch is the layout target (spec 002, Q9). Fall back to the first
          # available watchOS simulator only if the image has no 40 mm model.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):  # "…SimRuntime.watchOS-26-10" -> (26, 10), so 26.10 sorts after 26.2
              return tuple(int(part) for part in runtime.rsplit("watchOS-", 1)[1].split("-") if part.isdigit())
          runtimes = sorted((r for r in devices if "watchOS-" in r), key=version, reverse=True)
          watches = [d for r in runtimes for d in devices[r]]  # newest runtime first
          pinned = [d for d in watches if "(40mm)" in d["name"]]
          chosen = pinned[:1] or watches[:1]  # a 40 mm watch on the newest runtime that has one
          print(chosen[0]["udid"] if chosen else "")
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [ -z "$udid" ]; then echo "::warning::No watchOS simulator on this image; running build-for-testing only (R12 fallback)."; fi
          xcrun simctl list devices available | grep -F "$udid" || true
      - name: Boot the simulator
        if: steps.sim.outputs.udid != ''
        # A stuck boot fails here, not at the job timeout (#19 R1-3).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # UI tests tap only after the device has finished booting (#18 R1-1).
          # Only "already booted" is ignored; any other boot error fails the step.
          if ! out="$(xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -q "current state: Booted"
          fi
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Watch tests (${{ matrix.shard }}, layout matrix ${{ inputs.layout_matrix }})
        if: steps.sim.outputs.udid != ''
        env:
          SELECTION: ${{ matrix.selection }}
          # Reaches the UI test process as LAYOUT_MATRIX.
          TEST_RUNNER_LAYOUT_MATRIX: ${{ inputs.layout_matrix }}
        run: |
          set -euo pipefail
          selection=()
          while IFS= read -r line; do [ -n "$line" ] && selection+=("$line"); done <<< "$SELECTION"
          xcodebuild test \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for testing (no watchOS simulator)
        if: steps.sim.outputs.udid == ''
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
