name: Watch tests

# Watch unit and UI tests (spec 002, research R12), called by CI on every PR and by the nightly
# workflow. Four shards run in parallel to keep PR CI under about 20 minutes (CI budget, Denys:
# https://github.com/dfinchenko/tennis-beat/pull/31#issuecomment-6238799308 and
# https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6240987129). Every PR still runs
# every test; only the layout matrix of testUS6s2HeartRateFitsAndKeepsTheZones is cut to its
# worst case unless `layout_matrix` is "full". `rest` skips the classes the other shards name,
# so a new UI test class always runs.

on:
  workflow_call:
    inputs:
      layout_matrix:
        description: '"worst" (UK, XXXL, ♥ 205, all phases) or "full" (EN, PL, UK; ♥ 205 and "--")'
        type: string
        default: worst
      sc002_taps:
        description: '"last12" (PRs: the long part of each SC-002 sequence played at launch) or "all" (the nightly: every step tapped, SC-002)'
        type: string
        default: last12

permissions:
  contents: read

jobs:
  watch-tests:
    runs-on: macos-26
    # issues: write only for the "Flaky test retries" comment; callers must grant it.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced on CI times with the full layout matrix (UI minutes, #36): audits 11.4,
          # layout 11.8, flows 8.3, rest 7.9 + the SC-002 step (3.3 minutes with the last 12 steps
          # tapped); each job adds about 5 to 6 minutes of setup and build, and one job may start
          # about 2 minutes late when no runner is free (#37: flows). Four shards, so a PR that
          # runs the full matrix stays under about 20 minutes (Denys, relayed on #37:
          # https://github.com/dfinchenko/tennis-beat/pull/37#issuecomment-6310232479).
          - shard: audits
            selection: |
              -only-testing:TennisBeat Watch AppTests
              -only-testing:TennisBeat Watch AppUITests/AccessibilityAuditUITests
              -only-testing:TennisBeat Watch AppUITests/HealthOnboardingUITests
          - shard: layout
            selection: |
              -only-testing:TennisBeat Watch AppUITests/ScoreAccessibilityUITests
              -only-testing:TennisBeat Watch AppUITests/WorkoutUITests
          - shard: flows
            selection: |
              -only-testing:TennisBeat Watch AppUITests/ControlsUITests
              -only-testing:TennisBeat Watch AppUITests/SummaryUITests
              -only-testing:TennisBeat Watch AppUITests/SummaryHealthUITests
          - shard: rest
            selection: |
              -skip-testing:TennisBeat Watch AppTests
              -skip-testing:TennisBeat Watch AppUITests/AccessibilityAuditUITests
              -skip-testing:TennisBeat Watch AppUITests/HealthOnboardingUITests
              -skip-testing:TennisBeat Watch AppUITests/ScoreAccessibilityUITests
              -skip-testing:TennisBeat Watch AppUITests/WorkoutUITests
              -skip-testing:TennisBeat Watch AppUITests/ControlsUITests
              -skip-testing:TennisBeat Watch AppUITests/SummaryUITests
              -skip-testing:TennisBeat Watch AppUITests/SummaryHealthUITests
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfFourAdvantage
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfSixNoAd
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfEightAdvantage
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeFullThirdSetNoAd
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakAdvantage
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakNoAd
              -skip-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002TieBreakSetAdvantage
    name: watch-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Pick the 40 mm watchOS simulator
        id: sim
        run: |
          set -euo pipefail
          # The 40 mm watch is the layout target (spec 002, Q9). Fall back to the first
          # available watchOS simulator only if the image has no 40 mm model.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):  # "…SimRuntime.watchOS-26-10" -> (26, 10), so 26.10 sorts after 26.2
              return tuple(int(part) for part in runtime.rsplit("watchOS-", 1)[1].split("-") if part.isdigit())
          runtimes = sorted((r for r in devices if "watchOS-" in r), key=version, reverse=True)
          watches = [d for r in runtimes for d in devices[r]]  # newest runtime first
          pinned = [d for d in watches if "(40mm)" in d["name"]]
          chosen = pinned[:1] or watches[:1]  # a 40 mm watch on the newest runtime that has one
          print(chosen[0]["udid"] if chosen else "")
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [ -z "$udid" ]; then echo "::warning::No watchOS simulator on this image; running build-for-testing only (R12 fallback)."; fi
          xcrun simctl list devices available | grep -F "$udid" || true
      - name: Boot the simulator
        if: steps.sim.outputs.udid != ''
        # A stuck boot fails here, not at the job timeout (#19 R1-3).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # UI tests tap only after the device has finished booting (#18 R1-1).
          # Only "already booted" is ignored; any other boot error fails the step.
          if ! out="$(xcrun simctl boot "${{ steps.sim.outputs.udid }}" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -q "current state: Booted"
          fi
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Watch tests (${{ matrix.shard }}, layout matrix ${{ inputs.layout_matrix }})
        if: steps.sim.outputs.udid != ''
        env:
          SELECTION: ${{ matrix.selection }}
          # Reaches the UI test process as LAYOUT_MATRIX.
          TEST_RUNNER_LAYOUT_MATRIX: ${{ inputs.layout_matrix }}
          # Reaches the UI test process as SC002_TAPS.
          TEST_RUNNER_SC002_TAPS: ${{ inputs.sc002_taps }}
        run: |
          set -euo pipefail
          selection=()
          while IFS= read -r line; do [ -n "$line" ] && selection+=("$line"); done <<< "$SELECTION"
          rm -rf "$RUNNER_TEMP/watch-tests-${{ matrix.shard }}.xcresult"  # #33 R2-3
          xcodebuild test \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            "${selection[@]}" \
            -resultBundlePath "$RUNNER_TEMP/watch-tests-${{ matrix.shard }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: SC-002 scripted tests (one whole-test retry)
        # An environment flake drops a synthesized tap about once in 200 runs before it reaches
        # the app: the DEBUG tap log shows the tap reaching neither the score screen nor a zone
        # (#33, #36). Each of these tests may run once more as a whole test, never a tap retry,
        # and every retry is counted in the metrics (Denys, relayed on #33:
        # https://github.com/dfinchenko/tennis-beat/pull/33#issuecomment-6253707014, extended
        # to all seven on #36: https://github.com/dfinchenko/tennis-beat/pull/36#issuecomment-6301821874).
        # Every other test runs once.
        id: sc002
        if: steps.sim.outputs.udid != '' && matrix.shard == 'rest' && !cancelled()
        env:
          TEST_RUNNER_SC002_TAPS: ${{ inputs.sc002_taps }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/sc002.log"
          rm -rf "$RUNNER_TEMP/watch-tests-sc002.xcresult"  # #33 R2-3
          status=0
          xcodebuild test \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfFourAdvantage" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfSixNoAd" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002OneSetOfEightAdvantage" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeFullThirdSetNoAd" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakAdvantage" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakNoAd" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002TieBreakSetAdvantage" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/watch-tests-sc002.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log" || status=$?
          # One retry per test that failed its first attempt (#33 R1-2).
          retries="$(grep -cE "^Test Case '.*' started \(Iteration 2 of 2\)" "$log" || true)"
          echo "retries=$retries" >> "$GITHUB_OUTPUT"
          # The retried tests' names, for the tracking issue. A random delimiter, so no log line
          # can end the list early (#34 R3-4).
          delimiter="tests_$(uuidgen)"
          {
            echo "tests<<$delimiter"
            sed -nE "s/^Test Case '-\[[^ ]+ ([^]]+)\]' started \(Iteration 2 of 2\).*/\1/p" "$log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [ "$retries" -gt 0 ]; then
            { grep -E "^Test Case '.*' failed|error: -\[" "$log" || true; } | while IFS= read -r line; do
              echo "::warning title=SC-002 whole-test retry (count it in the metrics)::$line"
            done
            echo "::warning title=SC-002 whole-test retry (count it in the metrics)::$retries retried test(s)"
          fi
          exit "$status"
      - name: Record the retries in "Flaky test retries"
        # One comment per retried test with the run link, in PRs and the nightly; more than 2 in
        # 7 days opens an investigation issue (Denys, relayed on #34:
        # https://github.com/dfinchenko/tennis-beat/pull/34#issuecomment-6254956236). A token
        # without issues: write (a fork's PR) must not fail the tests.
        # Also when the job fails anyway (#34 R2-1).
        if: ${{ !cancelled() && steps.sc002.outputs.retries > 0 }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ steps.sc002.outputs.tests }}
        run: |
          set -euo pipefail
          tests=()
          while IFS= read -r line; do [ -n "$line" ] && tests+=("$line"); done <<< "$TESTS"
          # A retry is recorded even if no name was parsed (#34 R2-3).
          [ "${#tests[@]}" -gt 0 ] || tests=("(unknown test, see the run)")
          scripts/flaky-retries.sh "$RUN_URL" "${tests[@]}"
      - name: Save the app's tap log
        # The DEBUG tap log, to tell where a lost tap went (#33). It runs for a failure in any
        # shard on purpose: every UI test drives the same zones (#33 R3-4).
        if: (failure() || steps.sc002.outputs.retries > 0) && steps.sim.outputs.udid != ''
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --info --last 2h \
            --predicate 'subsystem == "com.dfinchenko.TennisBeat.watchkitapp" AND category == "tap"' \
            > "$RUNNER_TEMP/taplog.txt" || true
      - name: Keep the result bundle of a failed run
        # Only when the tests fail or an SC-002 test was retried, for 14 days (Denys, relayed on
        # #32: https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6247378603): it
        # holds the failing test's activity log and screenshots, with the app's tap log. The
        # SC-002 bundle exists only in `rest`; elsewhere `if-no-files-found: ignore` skips it
        # (#33 R3-4).
        if: (failure() || steps.sc002.outputs.retries > 0) && steps.sim.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: watch-tests-${{ matrix.shard }}-xcresult
          path: |
            ${{ runner.temp }}/watch-tests-${{ matrix.shard }}.xcresult
            ${{ runner.temp }}/watch-tests-sc002.xcresult
            ${{ runner.temp }}/taplog.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Build for testing (no watchOS simulator)
        if: steps.sim.outputs.udid == ''
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
