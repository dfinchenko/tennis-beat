name: Review gate

# Fails unless the PR body's Reviewed-SHA equals the PR head SHA (spec PRs included).
# "edited" re-runs the check when the PR body is updated after a review.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gates
      - name: Reviewed-SHA must equal the PR head
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/gates/check-review-gate.sh
