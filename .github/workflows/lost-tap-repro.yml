name: Lost-tap repro (TEMPORARY)

# TEMPORARY, removed before review: reproduces the lost tap of the SC-002 match tie-break tests
# on the CI runner, where it happened (#30, #32 run 39070518470), with the DEBUG-only tap log
# (Denys, relayed on #32: https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6247324680
# and https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6247378603).

on:
  push:
    branches: [feat/003-lost-tap]

permissions:
  contents: read

jobs:
  repro:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5]
    name: repro (${{ matrix.job }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the image
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Pick and boot the 40 mm watchOS simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(part) for part in runtime.rsplit("watchOS-", 1)[1].split("-") if part.isdigit())
          runtimes = sorted((r for r in devices if "watchOS-" in r), key=version, reverse=True)
          watches = [d for r in runtimes for d in devices[r]]
          pinned = [d for d in watches if "(40mm)" in d["name"]]
          print((pinned[:1] or watches[:1])[0]["udid"])
          ')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: SC-002 match tie-break tests, 20 iterations until failure
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TennisBeat/TennisBeat.xcodeproj \
            -scheme "TennisBeat Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakNoAd" \
            "-only-testing:TennisBeat Watch AppUITests/ScoringUITests/testSC002BestOfThreeMatchTieBreakAdvantage" \
            -test-iterations 20 -run-tests-until-failure \
            -resultBundlePath "$RUNNER_TEMP/repro.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Save the app's tap log
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/repro"
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --info --last 2h \
            --predicate 'subsystem == "com.dfinchenko.TennisBeat.watchkitapp" AND category == "tap"' \
            > "$RUNNER_TEMP/repro/taplog.txt" || true
          mv "$RUNNER_TEMP/repro.xcresult" "$RUNNER_TEMP/repro/" || true
      - name: Keep the result bundle and the tap log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-tap-repro-${{ matrix.job }}
          path: ${{ runner.temp }}/repro
          retention-days: 14
          if-no-files-found: ignore
