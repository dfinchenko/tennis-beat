name: Nightly

# The full layout matrix every night (CI budget, Denys:
# https://github.com/dfinchenko/tennis-beat/pull/31#issuecomment-6238799308): EN, PL and UK with
# ♥ 205 and "--", with the rest of the watch tests, and the SC-002 sequences with every step
# tapped. PRs run only the worst layout case unless they change header or layout files
# (scripts/layout-scope.sh), and tap only the final 12 steps of each SC-002 sequence.

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-tests:
    uses: ./.github/workflows/watch-tests.yml
    # issues: write for the "Flaky test retries" comment (#34).
    permissions:
      contents: read
      issues: write
    with:
      layout_matrix: full
      # SC-002's full tap-by-tap coverage: every step of each sequence tapped (Denys, relayed
      # on #37: https://github.com/dfinchenko/tennis-beat/pull/37#issuecomment-6310232479).
      sc002_taps: all

  # One issue for a failing nightly: opened or updated on failure, closed when a nightly passes
  # (Denys: https://github.com/dfinchenko/tennis-beat/pull/32#issuecomment-6241234335).
  report:
    needs: watch-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.watch-tests.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/nightly-issue.sh "$RESULT" "$RUN_URL"
